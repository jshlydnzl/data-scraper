name: Daily 5AM Scraper

on:
  schedule:
    # 21:00 UTC is exactly 5:00 AM in UTC+8 (Asia) time
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows you to run it manually anytime by clicking a button

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Script
        run: python data_scraper.py

      - name: Commit and Push New Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          git commit -m "Auto-Scrape: New data generated at 5 AM" || echo "No new data to commit"
          git push
